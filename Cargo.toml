[workspace]
resolver = "2"
members = [
    "crates/wire-ring-core",
    "crates/wire-ring",
    "benches",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Ulquiorra <contact@ulquiorra.dev>"]
repository = "https://github.com/ulquiorracode/wire-ring-rs"
homepage = "https://github.com/ulquiorracode/wire-ring-rs"
keywords = ["ring-buffer", "zero-copy", "mmap", "networking", "ipc"]
categories = ["data-structures", "network-programming", "concurrency", "no-std"]

[workspace.dependencies]
wire-ring-core = { path = "crates/wire-ring-core", default-features = false }
wire-ring = { path = "crates/wire-ring", default-features = false }
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
criterion = { version = "0.8", default-features = false }
crc32fast = { version = "1.4", default-features = false }
rtrb = "0.3"
bbqueue = "0.5"
bytes = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
